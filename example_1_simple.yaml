esphome:
  name: etrv2wifi
  comment: Extend Danfoss ECO eTRV BLE range over WiFi with ESPHome

esp32:
  board: esp32dev
  # esp-idf is the recommended (and current ESPHome default) framework for BLE projects
  framework:
    type: esp-idf

wifi:
  ssid: "my-ssid"
  password: "my-password"

external_components:
  - source: github://borstel4711/esphome-danfoss-eco

# The eTRV is connected to by MAC address - no continuous scanning is needed.
# Disabling it keeps the radio free for (re)connections.
esp32_ble_tracker:
  scan_parameters:
    continuous: false

ble_client:
  - mac_address: 00:04:2f:xx:xx:xx
    id: room_eco2

climate:
  - platform: danfoss_eco
    name: "My Room eTRV"
    ble_client_id: room_eco2
    pin_code: "0000"
    secret_key: deadbeefcafebabedeadbeefcafebabe
    battery_level:
      name: "My Room eTRV Battery Level"
    temperature:
      name: "My Room eTRV Temperature"
    problems:
      name: "My Room eTRV Problems"
    # Trade-off between freshness and eTRV battery life; HA commands are sent
    # immediately regardless of this interval. Default is 15min.
    update_interval: 15min
